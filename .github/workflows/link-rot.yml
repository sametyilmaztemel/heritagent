# Issue #18 / SPEC section 30: weekly external-link check for research/
# notes. Kept off the PR path because third-party sites fail transiently.
name: Link rot

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/ci/requirements-ci.txt
      - run: python scripts/ci/check_artifacts.py --external-links
