# Issue #18: tests on every supported Python (editable install), an
# installed-wheel smoke test, plus schema / manifest / Markdown-link and
# undefined-name checks. Test counts are attested by this workflow, not by
# builder reports.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Every other run
# (each main commit, a manual run) has a group of its own, so none of them
# waits for another or is cancelled as a pending run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # a normal run takes about 10 minutes; a hung test fails the job instead
    # of holding the runner for the 6-hour default
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -rs -p no:cacheprovider

  real-game:
    name: ALFWorld adapter on a real game (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # the alfworld extra builds jericho and fast-downward-textworld from source
      - run: python -m pip install -e ".[dev,alfworld]"
      # ADR-0003 D8: the adapter, and the TextWorld eval fix on Python 3.13,
      # against the committed game; a skip here means the real game did not run
      - shell: bash
        run: |
          python -m pytest -q -rs -p no:cacheprovider tests/runtime/test_alfworld_adapter.py | tee "$RUNNER_TEMP/adapter.txt"
          if grep -q "SKIPPED" "$RUNNER_TEMP/adapter.txt"; then
            echo "::error::tests/runtime/test_alfworld_adapter.py skipped a test; the real game must run here"
            exit 1
          fi

  package:
    name: wheel install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m venv "$RUNNER_TEMP/wheel-venv"
      - run: '"$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl'
      # -I and a cwd outside the checkout: imports must come from the wheel
      - working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/wheel-venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/ci/smoke_installed.py" "$GITHUB_WORKSPACE"'

  artifacts:
    name: schemas, manifests, links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" -r scripts/ci/requirements-ci.txt
      - run: python scripts/ci/check_artifacts.py
      - if: ${{ !cancelled() }}
        run: yamllint --strict -c .yamllint.yaml experiments/manifests .github/workflows
      - if: ${{ !cancelled() }}
        run: ruff check --select F821 .
