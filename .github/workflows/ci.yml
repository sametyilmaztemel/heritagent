# Issue #18: tests on every supported Python, plus schema / manifest /
# Markdown-link checks. Test counts are attested by this workflow, not by
# builder reports.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r scripts/ci/requirements-ci.txt
      - run: python -m pytest -q -p no:cacheprovider

  artifacts:
    name: schemas, manifests, links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/ci/requirements-ci.txt
      - run: python scripts/ci/check_artifacts.py
      - run: yamllint --strict -c .yamllint.yaml experiments/manifests .github/workflows
