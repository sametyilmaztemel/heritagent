[project]
name = "heritagent"
version = "0.1.0"
description = "Causally-gated assimilation of acquired skills into functional genomes for evolvable LLM agents"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
