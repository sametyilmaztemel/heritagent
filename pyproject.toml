[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heritagent"
version = "0.1.0"
description = "Causally-gated assimilation of acquired skills into functional genomes for evolvable LLM agents"
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
# pyyaml: tests/ci reads the locked manifests (no notebook installs the dev extra)
dev = ["pytest>=8", "matplotlib>=3.8", "pyyaml>=6"]
# paper figures from a run's records (evaluation/exp0001/figures.py)
figures = ["matplotlib>=3.8"]
# ADR-0003 D8: pinned versions the adapter was checked against
alfworld = ["alfworld==0.4.2", "textworld==1.7.0"]

# Explicit package list: flat-layout auto-discovery refuses a repo with
# several top-level directories (research/, experiments/, ...). namespaces
# picks up somatic/ and the schema directories, which have no __init__.py.
[tool.setuptools.packages.find]
include = ["genome*", "runtime*", "traits*", "trajectory*", "inheritance*", "somatic*", "evaluation*"]
namespaces = true

# Modules locate their JSON Schemas and prompts relative to __file__.
[tool.setuptools.package-data]
"*" = ["*.json", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# a test still running after 5 minutes prints every thread's stack (it is not stopped)
faulthandler_timeout = 300
